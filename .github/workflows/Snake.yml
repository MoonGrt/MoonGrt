name: Snake

on:
  # Schedule daily updates
  schedule:
    - cron: "25 0 * * *"
  # Run workflow manually
  workflow_dispatch:

concurrency:
  group: profile-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate Snack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate Snake.svg
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/snake.svg
            images/snake-dark.svg?palette=github-dark
      # Commit and push the changes to the current branch
      - name: Commit & Push
        run: |
          git config --local user.name "MoonGrt"
          git config --local user.email "1561145394@qq.com"
          git add images/*.svg
          git commit -m "update Snake.svg" || echo "No changes to commit"
          git pull --rebase # 同步远程分支
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
